spring:
  application:
    name: classbridge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false  # avoid lazy-loading-in-controller footguns
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7

logging:
  level:
    com.classbridge.platform: DEBUG
    org.hibernate.SQL: DEBUG