spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate   # never auto-migrate schema in prod; use Flyway/Liquibase before this matters

logging:
  level:
    com.livestudy.platform: INFO
    org.hibernate.SQL: WARN
